    <linearGradient id="storyRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#716a4b"/>
      <stop offset="100%" stop-color="#5e7a6e"/>
    </linearGradient>
  </defs>
  <circle cx="12" cy="12" r="10" stroke="url(#storyRing)" stroke-width="2" fill="none"/>
  <circle cx="12" cy="12" r="7" stroke="url(#storyRing)" stroke-width="1.5" fill="none" opacity="0.7"/>
</svg>
